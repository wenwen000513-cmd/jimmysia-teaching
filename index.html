const star='<svg viewBox="0 0 64 64" fill="currentColor" aria-hidden="true"><path d="m32 5 8.1 17.4 19 2.4-14 13.1 3.8 18.8L32 47.3 15.1 56.7l3.8-18.8L5 24.8l19-2.4Z"/></svg>';
const book='<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M32 16c-8-6-16-7-25-5v38c9-2 17-1 25 5 8-6 16-7 25-5V11c-9-2-17-1-25 5Zm0 0v38"/><path d="m15 21 9 2m-9 7 9 2m16-9 9-2m-9 11 9-2"/></svg>';
const notesIcon='<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M37 7H12v50h35V17L37 7Z"/><path d="M36 7v12h11M19 28l3 3 5-6m-8 17 3 3 5-6m6-10h7m-7 14h7m8-5L58 18l-5-3-11 21-1 8 7-6Z"/></svg>';
const iwbIcon='<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 16h48v7H8zM12 23v31h40V23M28 16v-4a4 4 0 0 1 8 0v4"/><text x="32" y="43" fill="currentColor" stroke="none" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">IWB</text></svg>';
const colors=Array.from({length:3},()=>['#f7f7f7','#e8e8e8','#171717']);
function card(title,sub,href,icon,c=colors[0],unit=false){return `<a class="card ${unit?'unit':''}" href="${href}" style="--tint:${c[0]};--icon:${c[1]};--color:${c[2]}"><div class="visual"><div class="tile-icon ${typeof icon==='number'?'number':''}">${icon}</div></div><div class="card-bottom"><div><div class="card-title">${title}</div><div class="card-sub">${sub}</div></div><span class="arrow" aria-hidden="true">↗</span></div></a>`}
const characterNames=['Pip','Bud','Cub','Kit','Pup','Dot'];
const listeningQuestions=[{name:'Pip',choices:['Bud','Pip','Cub']},{name:'Dot',choices:['Kit','Pup','Dot']},{name:'Cub',choices:['Cub','Bud','Kit']},{name:'Bud',choices:['Pip','Dot','Bud']},{name:'Kit',choices:['Kit','Cub','Pup']},{name:'Pup',choices:['Dot','Pup','Pip']}];
let questionIndex=0,quizAnswers={},quizAudio=null,imageZoom=1;
function stopQuizAudio(){if(quizAudio){quizAudio.pause();quizAudio.currentTime=0;quizAudio=null}}
function playCharacter(){
 stopQuizAudio();const q=listeningQuestions[questionIndex];quizAudio=new Audio('media/unit1-lesson2/'+q.name.toLowerCase()+'-natural.wav');
 quizAudio.play().catch(()=>{document.getElementById('quiz-feedback').textContent='Audio could not play. Please try Listen again.'});
}
function quizMarkup(){
 const q=listeningQuestions[questionIndex],answered=quizAnswers[questionIndex];
 return `<div class="listening-quiz"><div class="quiz-top"><span class="eyebrow">LISTEN & CHOOSE</span><span class="quiz-progress">${questionIndex+1} / ${listeningQuestions.length}</span></div><h2>Who is speaking?</h2><p class="quiz-instruction">Listen, then choose the character.</p><button class="listen-button" onclick="playCharacter()">▶ Listen</button><div class="character-options">${q.choices.map((name,i)=>`<button class="character-choice ${answered===name?'correct':''}" aria-label="Option ${String.fromCharCode(65+i)}${answered?', '+name:''}" onclick="chooseCharacter('${name}')" ${answered?'disabled':''}><img src="media/unit1-lesson2/${name.toLowerCase()}.png" alt="${answered?name:'Character option '+String.fromCharCode(65+i)}"><span>${answered?name:String.fromCharCode(65+i)}</span></button>`).join('')}</div><p id="quiz-feedback" class="quiz-feedback" role="status">${answered?"Correct! I'm "+q.name+'.':'Press Listen to begin.'}</p><div class="quiz-actions"><button onclick="moveQuestion(-1)" ${questionIndex===0?'disabled':''}>← Previous question</button><button onclick="restartQuiz()">↻ Restart</button><button onclick="moveQuestion(1)" ${!answered||questionIndex===5?'disabled':''}>Next question →</button></div>${Object.keys(quizAnswers).length===6?'<p class="quiz-complete">Well done! You completed all 6 questions.</p>':''}</div>`;
}
function updateQuiz(){document.querySelector('.activity-stage').innerHTML=quizMarkup()}
function chooseCharacter(name){
 if(quizAnswers[questionIndex])return;
 const q=listeningQuestions[questionIndex];
 if(name===q.name){quizAnswers[questionIndex]=name;updateQuiz()}else{document.getElementById('quiz-feedback').textContent='Try again. Listen and choose another character.';}
}
function moveQuestion(direction){const next=questionIndex+direction;if(next<0||next>=6||direction>0&&!quizAnswers[questionIndex])return;stopQuizAudio();questionIndex=next;updateQuiz();playCharacter()}

const traceLetters=['c','k','b','g'];
const traceGuides={c:{paths:['M485 145 C415 85 300 135 300 220 C300 305 410 335 485 275'],starts:[[485,145]]},k:{paths:['M320 65 L320 320','M475 145 L320 235 L480 320'],starts:[[320,65],[475,145]]},b:{paths:['M320 65 L320 320','M320 205 C355 110 490 125 490 225 C490 325 360 350 320 280'],starts:[[320,65],[320,205]]},g:{paths:['M470 155 C420 105 305 125 305 215 C305 305 425 320 470 255','M470 145 L470 310 C470 385 365 390 335 345'],starts:[[470,155],[470,145]]}};

function traceMarkup(){const letter=traceLetters[tracePage],g=traceGuides[letter];return `<div class="trace-activity"><div class="quiz-top"><span class="eyebrow">TRACE & WRITE</span><span class="quiz-progress">${tracePage+1} / 4</span></div><h2>Trace the letter <strong>${letter}</strong></h2><p class="quiz-instruction">Start at the numbered dot. Trace with your finger or mouse.</p><div class="trace-board"><svg viewBox="0 0 800 400" aria-hidden="true"><path d="M30 65H770 M30 145H770 M30 320H770 M30 380H770" stroke="#e5e5e5" fill="none" stroke-width="1"/><path d="M30 230H770" stroke="#e5e5e5" stroke-dasharray="6 8"/>${g.paths.map(p=>`<path d="${p}" fill="none" stroke="#a0a0a0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 16"/>`).join('')}${g.starts.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="16" fill="white" stroke="#555555" stroke-width="2"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="15" fill="#171717">${i+1}</text>`).join('')}</svg><canvas id="trace-canvas" width="800" height="400" tabindex="0" aria-label="Draw over lowercase ${letter}. Use mouse, stylus, or touch."></canvas></div><div class="quiz-actions trace-tools"><button onclick="undoTrace()">Undo</button><button onclick="clearTrace()">Clear writing</button></div><div class="quiz-actions"><button onclick="moveTracePage(-1)" ${tracePage===0?'disabled':''}>← Previous page</button><span class="trace-letter-label">${letter}</span><button onclick="moveTracePage(1)" ${tracePage===3?'disabled':''}>Next page →</button></div><p class="trace-status" role="status">${traceStrokes[tracePage].length?'Keep practising!':'Ready to trace.'}</p></div>`}
function paintTrace(){const canvas=document.getElementById('trace-canvas');if(!canvas)return;const ctx=canvas.getContext('2d');ctx.clearRect(0,0,800,400);ctx.strokeStyle='#171717';ctx.fillStyle='#171717';ctx.lineWidth=11;ctx.lineCap='round';ctx.lineJoin='round';for(const stroke of traceStrokes[tracePage]){if(!stroke.length)continue;ctx.beginPath();ctx.moveTo(stroke[0][0],stroke[0][1]);if(stroke.length===1){ctx.arc(stroke[0][0],stroke[0][1],5.5,0,Math.PI*2);ctx.fill()}else{for(const p of stroke.slice(1))ctx.lineTo(p[0],p[1]);ctx.stroke()}}}
function initTrace(){const canvas=document.getElementById('trace-canvas');if(!canvas||!canvas.getContext)return;paintTrace();const point=e=>{const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*800/r.width,(e.clientY-r.top)*400/r.height]};canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);traceDrawing={pointer:e.pointerId,stroke:[point(e)]};traceStrokes[tracePage].push(traceDrawing.stroke);paintTrace()});canvas.addEventListener('pointermove',e=>{if(!traceDrawing||traceDrawing.pointer!==e.pointerId)return;e.preventDefault();traceDrawing.stroke.push(point(e));paintTrace()});const finish=e=>{if(!traceDrawing||traceDrawing.pointer!==e.pointerId)return;traceDrawing=null;const status=document.querySelector('.trace-status');if(status)status.textContent='Keep practising!'};canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);canvas.addEventListener('lostpointercapture',()=>{traceDrawing=null})}

 const slideContent=lesson5&&slide===3?countMarkup():lesson5&&slide===4?characterSongMarkup():lesson5&&slide===5?uzMarkup():lesson5&&slide===6?zoomMarkup('media/unit1-lesson5/speaking-page.png','Unit 1 Talking About Me speaking worksheet. Pip holds v and Kit holds x. Say and circle matching letters.'):lesson3&&slide===5?letterMarkup():lesson3&&slide===6?traceMarkup():lesson4&&slide===3?bodyImageMarkup():lesson4&&slide===4?bodyRevealMarkup():lesson3&&slide===3?zoomMarkup("media/unit1-lesson3/speaking-page.png","Unit 1 Talking About Me speaking worksheet: point, say and colour numbers 1 to 5."):lesson3&&slide===4?colorMarkup():special&&slide===2?quizMarkup():special&&slide===3?zoomMarkup():song?`<video controls playsinline preload="metadata" poster="media/${song.file}.jpg" aria-label="${song.title}"><source src="media/${song.file}.mp4" type="video/mp4">Your browser does not support video playback. <a href="media/${song.file}.mp4">Open ${song.title}</a></video>`:`<span class="stage-label">JIMMYSIA · IWB ACTIVITIES</span><div class="slide-content"><div class="slide-mark" aria-hidden="true">${String(slide).padStart(2,'0')}</div><h2>Slide ${slide}</h2><p>Lesson content is coming soon.</p></div>`;

 document.getElementById('app').innerHTML=`<section class="slide-player" aria-label="Lesson slideshow"><div class="player-toolbar"><div class="player-heading"><h1>Lesson${lesson}</h1><p>SUPERSTAR · LEVEL 2 · UNIT${unit}</p></div><nav class="slide-tabs" aria-label="Slide navigation">${Array.from({length:totalSlides},(_,i)=>`<a class="slide-tab" href="${link(i+1)}" aria-label="Slide ${i+1}" ${slide===i+1?'aria-current="page"':''}>${i+1}</a>`).join('')}</nav><a class="player-back" href="${lessonPath}">← Back to resources</a></div><section class="slide-stage ${song?'video-stage':lesson5&&slide===3?'l5-count-stage l5-stage':lesson5&&slide===4?'l5-song-stage l5-stage':lesson5&&slide===5?'l5-uz-stage l5-stage':lesson5&&slide===6?'worksheet-stage':special&&slide===2?'activity-stage':(special||lesson3||lesson4)&&slide===3?'worksheet-stage':(lesson3||lesson4)&&slide===4?'color-stage':lesson3&&slide===5?'letter-stage':lesson3&&slide===6?'trace-stage':''}" aria-label="Slide ${slide} of ${totalSlides}">${slideContent}</section><div class="slide-footer"><div><h2>${slideTitle}</h2><p>Unit${unit} · Lesson${lesson}</p></div><div class="slide-controls"><span class="slide-counter" aria-live="polite">${slide} / ${totalSlides}</span><a class="slide-control" ${slide>1?'href="'+link(slide-1)+'"':'aria-disabled="true"'}>← Previous</a><a class="slide-control" ${slide<totalSlides?'href="'+link(slide+1)+'"':'aria-disabled="true"'}>Next →</a></div></div></section>`;
 if(lesson3&&slide===6)initTrace();
 document.title='Slide '+slide+' · Lesson'+lesson+' · Unit'+unit+' · Jimmysia';
}
function render(){
 stopQuizAudio();stopPhonics();stopBodyAudio();stopL5Audio();
 const seg=(location.hash.slice(1)||'/').split('/').filter(Boolean);
 const coursePath='#/superstar',levelPath=coursePath+'/level-2';
 let title='Course Library',desc='Choose a course. Discover something new.',tag='EXPLORE & TEACH',section='All courses',count='01 COURSE',cards=card('Superstar','Explore course · 3 levels',coursePath,star),crumb='<span class="current">Home</span>',art=book,back='';
 let activeUnit=null,activeLesson=null,activeResource=null;
 if(seg[0]==='superstar'){
  title='Superstar';desc='A world of discovery, one level at a time.';tag='COURSE COLLECTION';section='Choose a level';count='03 LEVELS';
  crumb='<a href="#/">Home</a><span>/</span><span class="current">Superstar</span>';
  cards=[2,3,4].map((x,i)=>card('Level '+x,x===2?'10 units':'Coming soon',coursePath+'/level-'+x,x,colors[i])).join('');
  art=star;back='<a class="back" href="#/">← Back to courses</a>';
  if(seg[1]){
   const level=Number(seg[1].replace('level-',''));
   if(![2,3,4].includes(level)){location.hash=coursePath;return}
   title='Level '+level;tag='SUPERSTAR COLLECTION';section=level===2?'Choose a unit':'Teaching units';count=level===2?'10 UNITS':'COMING SOON';desc=level===2?'Choose a unit and start exploring.':'New classroom discoveries are on their way.';
   crumb='<a href="#/">Home</a><span>/</span><a href="'+coursePath+'">Superstar</a><span>/</span><span class="current">'+title+'</span>';
   cards=level===2?Array.from({length:10},(_,i)=>card('Unit'+(i+1),'6 lessons',levelPath+'/unit-'+(i+1),i+1,colors[0],true)).join(''):'';
   back='<a class="back" href="'+coursePath+'">← Back to levels</a>';
   if(level===2&&seg[2]){
    const match=/^unit-(10|[1-9])$/.exec(seg[2]);
    if(!match){location.hash=levelPath;return}
    activeUnit=Number(match[1]);
    const unitPath=levelPath+'/unit-'+activeUnit;
    title='Unit'+activeUnit;tag='SUPERSTAR · LEVEL 2';section='Choose a lesson';count='06 LESSONS';desc='Six lessons. One new adventure.';
    crumb='<a href="#/">Home</a><span>/</span><a href="'+coursePath+'">Superstar</a><span>/</span><a href="'+levelPath+'">Level 2</a><span>/</span><span class="current">'+title+'</span>';
    cards=Array.from({length:6},(_,i)=>card('Lesson'+(i+1),'UNIT'+activeUnit+' · LEVEL 2',unitPath+'/lesson-'+(i+1),i+1,colors[0],true)).join('');
    art=book;back='<a class="back" href="'+levelPath+'">← Back to units</a>';
    if(seg[3]){
     const lessonMatch=/^lesson-([1-6])$/.exec(seg[3]);
     if(!lessonMatch){location.hash=unitPath;return}
     activeLesson=Number(lessonMatch[1]);
     const lessonPath=unitPath+'/lesson-'+activeLesson;
     title='Lesson'+activeLesson;tag='SUPERSTAR · LEVEL 2 · UNIT'+activeUnit;
     section='Lesson resources';count='02 RESOURCES';desc='Everything you need for this lesson.';
     crumb='<a href="#/">Home</a><span>/</span><a href="'+coursePath+'">Superstar</a><span>/</span><a href="'+levelPath+'">Level 2</a><span>/</span><a href="'+unitPath+'">Unit'+activeUnit+'</a><span>/</span><span class="current">'+title+'</span>';
     cards=card("Teachers' Notes",'LESSON GUIDE',lessonPath+'/teachers-notes',notesIcon)+card('IWB activities',activeUnit===1&&[3,5].includes(activeLesson)?'7 SLIDES':activeUnit===1&&activeLesson===4?'5 SLIDES':'4 SLIDES',lessonPath+'/iwb-activities',iwbIcon);
     back='<a class="back" href="'+unitPath+'">← Back to lessons</a>';
     if(seg[4]){
      if(!['teachers-notes','iwb-activities'].includes(seg[4])){location.hash=lessonPath;return}
      activeResource=seg[4];
     }
    }
   }
  }
 }
 if(activeResource==='iwb-activities'){renderSlides(activeUnit,activeLesson,seg);return}
 document.getElementById('app').innerHTML=`<nav aria-label="Breadcrumb">${crumb}</nav><section class="hero"><div><div class="eyebrow">${tag}</div><h1>${title}</h1><p>${desc}</p></div><div class="hero-art">${art}</div></section><div class="section-head"><h2>${section}</h2><span class="count">${count}</span></div>${cards?'<div class="grid '+(activeLesson?'resources':'')+'">'+cards+'</div>':'<div class="empty">'+book+'<h2>More to explore soon</h2><p>Teaching units for this level will be added soon.</p></div>'}${back}`;
 document.title=title+' · Jimmysia';
 const dialog=document.getElementById('resource-dialog');
 if(activeResource){
  document.getElementById('resource-title').textContent=activeResource==='teachers-notes'?"Teachers' Notes":'IWB activities';
  document.getElementById('resource-context').textContent='LEVEL 2 · UNIT'+activeUnit+' · LESSON'+activeLesson;
  if(!dialog.open)dialog.showModal();
 }else if(dialog.open)dialog.close();
}
window.addEventListener('hashchange',render);
window.addEventListener('keydown',e=>{
 if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||!['ArrowLeft','ArrowRight'].includes(e.key))return;
 if(e.target&&['INPUT','TEXTAREA','SELECT','VIDEO','CANVAS'].includes(e.target.tagName)||e.target&&e.target.isContentEditable)return;
 const match=/^(#\/superstar\/level-2\/unit-(?:10|[1-9])\/lesson-[1-6]\/iwb-activities)(?:\/slide-([1-7]))?$/.exec(location.hash);
 if(!match)return;
 const current=Number(match[2]||1),next=current+(e.key==='ArrowRight'?1:-1);
 e.preventDefault();const limit=(match[1].includes('/unit-1/lesson-3/')||match[1].includes('/unit-1/lesson-5/'))?7:match[1].includes('/unit-1/lesson-4/')?5:4;
 e.preventDefault();if(next>=1&&next<=limit)location.hash=match[1]+'/slide-'+next;
});
document.getElementById('resource-dialog').addEventListener('close',()=>{
 if(/\/(teachers-notes|iwb-activities)$/.test(location.hash))location.hash=location.hash.replace(/\/(teachers-notes|iwb-activities)$/,'');
});
document.getElementById('resource-dialog').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});
render();
</script></body></html>
